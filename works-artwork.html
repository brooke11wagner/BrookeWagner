<style>

  :root {
    --purple:#b59fbe; --olive:#75805b; --teal:#5b8770;
    --cream:#e3e1dd; --brown:#5b3d42; --dpurple:#1601da; --sage:#b7bfa4;
    --white:#ffffff;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{font-family:"Raleway",sans-serif;background:var(--cream);color:var(--brown);font-size:16px;line-height:1.6;}
  nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:.9rem 4rem;background:rgba(227,225,221,0.93);backdrop-filter:blur(8px);border-bottom:1px solid rgba(91,61,66,0.12);}
  .nav-logo{display:flex;align-items:center;gap:.7rem;text-decoration:none;}
  .nav-logo img{height:40px;width:auto;}
  .nav-logo span{font-family:"Playfair Display",serif;font-size:1.35rem;color:var(--brown);letter-spacing:.01em;}
  .nav-links{display:flex;gap:2.5rem;list-style:none;}
  .nav-links a{text-decoration:none;color:var(--olive);font-size:.95rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;transition:color .2s;}
  .nav-links a:hover,.nav-links a.active{color:var(--brown);}
  footer{background:var(--brown);color:var(--sage);padding:2.5rem 4rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;}
  .footer-logo{display:flex;align-items:center;gap:.6rem;}
  .footer-logo img{height:32px;width:auto;opacity:.85;}
  .footer-logo span{font-family:"Playfair Display",serif;font-size:1rem;color:var(--cream);}
  .footer-links{display:flex;gap:1.5rem;}
  .footer-links a{font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:rgba(183,191,164,.65);text-decoration:none;transition:color .2s;}
  .footer-links a:hover{color:var(--sage);}
  .footer-copy{font-size:.75rem;color:rgba(183,191,164,.5);letter-spacing:.04em;}
  @media(max-width:900px){nav{padding:.9rem 2rem;}footer{padding:2rem;flex-direction:column;text-align:center;}}
  @media(max-width:600px){.nav-links{display:none;}}
